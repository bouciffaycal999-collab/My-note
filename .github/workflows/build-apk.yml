name: Build CERAMICA POS APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore Firebase config from GitHub Secret
        id: firebase_cfg
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          fi
          if [ -s app/google-services.json ]; then
            echo "has_firebase=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_firebase=false" >> "$GITHUB_OUTPUT"
            echo "::warning::app/google-services.json absent : l'APK sera compilé en mode local sans sync Cloud tant que le secret GOOGLE_SERVICES_JSON n'est pas ajouté dans GitHub."
          fi

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare and verify CERAMICA_POS.apk
        run: |
          ZIPALIGN=$(find "${ANDROID_HOME}/build-tools" -name zipalign | sort -V | tail -n1)
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n1)
          "$ZIPALIGN" -P 16 -f 4 app/build/outputs/apk/debug/app-debug.apk CERAMICA_POS.apk
          "$ZIPALIGN" -c -P 16 4 CERAMICA_POS.apk
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            CERAMICA_POS.apk
          "$APKSIGNER" verify --verbose --min-sdk-version 21 CERAMICA_POS.apk

      - name: Publish direct APK download in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_FIREBASE: ${{ steps.firebase_cfg.outputs.has_firebase }}
        run: |
          if [ "$HAS_FIREBASE" = "true" ]; then
            NOTES="Tap CERAMICA_POS.apk below to install (do NOT install the Actions .zip directly). If an older Ceralux/CERAMICA build is already installed with a different key, uninstall the old app first. Google Cloud & Firestore Online Sync: ACTIVE."
          else
            NOTES="Tap CERAMICA_POS.apk below to install (do NOT install the Actions .zip directly). If an older Ceralux/CERAMICA build is already installed with a different key, uninstall the old app first. Mode Local uniquement (ajoutez le secret GOOGLE_SERVICES_JSON dans GitHub Settings -> Secrets -> Actions puis relancez le workflow pour activer le mode Online)."
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest CERAMICA_POS.apk --clobber
            gh release edit latest --title "Ceralux POS (APK)" --notes "$NOTES"
          else
            gh release create latest CERAMICA_POS.apk \
              --title "Ceralux POS (APK)" \
              --notes "$NOTES"
          fi

      - name: Upload APK artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: CERAMICA_POS_APK
          path: CERAMICA_POS.apk
